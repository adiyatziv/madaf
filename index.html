   Add / edit sheet
   ====================================================== */
const STAR_PATH = 'M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z';
function starSVG(fill, id) {
  return `<svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="${id}"><stop offset="${fill * 100}%" stop-color="#FFC93C"/><stop offset="${fill * 100}%" stop-color="#FFE08A" stop-opacity=".25"/></linearGradient></defs><path d="${STAR_PATH}" fill="url(#${id})" stroke="#E2A21E" stroke-width="1.3" stroke-linejoin="round"/></svg>`;
}
function starsWidget(val) {
  // left-to-right, like stars everywhere; each star has two halves that are easy to tap
  return `<div class="stars-in"><button type="button" class="stars-clear" data-stars-clear>בלי כוכבים</button><span class="stars-val" id="stars-val">${val ? val : ''}</span><div class="stars-row" role="radiogroup" aria-label="כוכבים">${[1, 2, 3, 4, 5].map(i => `<span class="star-btn">${starSVG(val >= i ? 1 : val >= i - .5 ? .5 : 0, 'sg' + i)}<button type="button" class="half l" data-star="${i - .5}" role="radio" aria-checked="${val === i - .5}" aria-label="${i - .5} כוכבים"></button><button type="button" class="half r" data-star="${i}" role="radio" aria-checked="${val === i}" aria-label="${i} כוכבים"></button></span>`).join('')}</div></div>`;
}
const miniStars = r => r ? `<span class="mini-stars" aria-label="${r} כוכבים">${'★'.repeat(Math.floor(r))}${r % 1 ? '½' : ''}</span>` : '';
const todayISO = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);

function openItemSheet(kind, item, status = 'done') {
  const f = FORM[kind];
  const k = KINDS[kind];
  const isNew = !item;
  const d = item ? { ...item } : { kind, title: '', creator: '', status: status === 'dropped' ? 'done' : status, tier: null, note: '', ...(f.chipKey ? { [f.chipKey]: f.defaultChip } : {}) };
  const statusOpts = ['done', 'inProgress', 'want', 'dropped'].filter(s => !(kind === 'movie' && s === 'inProgress' && d.status !== s)).map(s => [s, s === 'dropped' ? 'עזבתי באמצע' : statusLabel(kind, s)]);

  openSheet(kind, isNew ? `הוספת ${k.one}` : `עריכת ${k.one}`, `
    <form id="item-form" novalidate>
      ${!isNew && item.status !== 'done' ? `<div class="quick-done"><p>${k.doneQ} בחרי איך היה, וזה עובר ל"${k.done}":</p>${quickDoneHTML(kind)}</div>` : ''}
      <div class="cover-edit">
        <span class="cv cover-prev" id="cover-prev"></span>
        <div class="cover-btns">
          <button type="button" class="mini-btn" data-cov="alts">${kind === 'book' ? 'כריכות אחרות' : 'תמונות אחרות'}</button>
          <button type="button" class="mini-btn" data-cov="upload">העלאת תמונה מהמכשיר</button>
          <button type="button" class="mini-btn" data-cov="url">קישור לתמונה</button>
          <button type="button" class="mini-btn" data-cov="none">בלי תמונה</button>
        </div>
      </div>
      <div class="url-row" id="url-row" hidden>
        <input class="inp" id="f-url" type="url" inputmode="url" placeholder="https://…" dir="ltr" aria-label="קישור לתמונה">
        <button type="button" class="mini-btn" data-cov="url-apply">שימוש</button>
      </div>
      <div class="alt-grid" id="alt-grid" hidden></div>
      <div class="field">
        <label for="f-title">שם ה${k.one}</label>
        <input class="inp" id="f-title" autocomplete="off" placeholder="מתחילים להקליד…" value="${esc(d.title)}" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="ac-list">
        <div class="ac" id="ac-list" role="listbox" hidden></div>
        <div class="err" id="err-title" hidden>צריך שם</div>
      </div>
      <div class="field">
        <label for="f-creator">${f.creatorLabel}</label>
        <input class="inp" id="f-creator" autocomplete="off" value="${esc(d.creator)}">
      </div>
      ${kind === 'movie' || kind === 'series' ? `<div class="field">
        <span class="lbl" id="lbl-genre">ז'אנרים</span>
        <div class="opts genre-opts" role="group" aria-labelledby="lbl-genre">${GENRE_LIST.map(g => `<button type="button" class="opt" data-genre="${g}" aria-pressed="${(d.genres || []).includes(g)}">${g}</button>`).join('')}</div>
      </div>` : ''}
      <div class="field">
        <span class="lbl" id="lbl-status">איפה זה עומד</span>
        <div class="opts" role="group" aria-labelledby="lbl-status">${statusOpts.map(([v, l]) => `<button type="button" class="opt" data-status="${v}" aria-pressed="${d.status === v}">${l}</button>`).join('')}</div>
      </div>
      <div class="field" id="tier-field" ${d.status === 'done' ? '' : 'hidden'}>
        <span class="lbl" id="lbl-tier">הדירוג שלי</span>
        <div class="opts" role="group" aria-labelledby="lbl-tier">${TIERS[kind].map(t => `<button type="button" class="opt tier" data-tier="${t.key}" aria-pressed="${d.tier === t.key}"><span aria-hidden="true">${t.icon}</span>${t.label}</button>`).join('')}</div>
        <div class="err" id="err-tier" hidden>בחרי דירוג</div>
      </div>
      <div class="field">
        <span class="lbl">כוכבים (לא חובה)</span>
        <div id="stars-box">${starsWidget(d.rating || 0)}</div>
      </div>
      <div class="two-col" id="done-extra" ${d.status === 'done' ? '' : 'hidden'}>
        <div class="field"><label for="f-finished">מתי סיימתי</label><input class="inp" id="f-finished" type="date" value="${esc(d.finishedOn || (isNew || !item.finishedOn ? todayISO() : item.finishedOn))}"></div>
        <div class="field"><span class="lbl" id="lbl-rw">פעמים נוספות</span><div class="stepper" role="group" aria-labelledby="lbl-rw"><button type="button" data-rw="-1" aria-label="פחות">−</button><output id="rw-val">${d.rewatchCount || 0}</output><button type="button" data-rw="1" aria-label="עוד">+</button></div></div>
      </div>
      ${f.chipKey ? `<div class="field">
        <span class="lbl" id="lbl-chip">${f.chipLabel}</span>
        <div class="opts" role="group" aria-labelledby="lbl-chip">${f.chips.map(([v, l]) => `<button type="button" class="opt" data-chip="${v}" aria-pressed="${d[f.chipKey] === v}">${l}</button>`).join('')}</div>
      </div>` : ''}
      <div class="field">
        <label for="f-note">מה חשבתי (לא חובה)</label>
        <input class="inp" id="f-note" value="${esc(d.note)}" maxlength="200">
      </div>
      <div class="two-col">
        <div class="field"><label for="f-why">למה הוספתי</label><input class="inp" id="f-why" value="${esc(d.whyAdded || '')}" maxlength="120"></div>
        <div class="field"><label for="f-rec">מי המליץ</label><input class="inp" id="f-rec" value="${esc(d.recommendedBy || '')}" maxlength="60"></div>
      </div>
    </form>`,
    `<button type="submit" form="item-form" class="save-btn">${isNew ? 'הוספה למדף' : 'שמירה'}</button><span class="grow"></span>${isNew ? '' : '<button type="button" class="del-btn" data-del>מחיקה</button>'}`);

  if (!isNew && item.status !== 'done') bindQuickDone(item);
  const prev = $('#cover-prev', sheet);
  const drawCover = () => { prev.innerHTML = coverInner({ ...d, id: '__draft' }); };
  drawCover();
  const setCover = (patch, touched = true) => {
    delete d.coverId; delete d.coverUrl; delete d.coverData; delete d.coverSource;
    Object.assign(d, patch);
    if (touched) d.coverTouched = true;
    drawCover();
  };

  sheet.querySelectorAll('[data-status]').forEach(b => b.onclick = () => {
    d.status = b.dataset.status;
    sheet.querySelectorAll('[data-status]').forEach(x => x.setAttribute('aria-pressed', x === b));
    $('#tier-field', sheet).hidden = d.status !== 'done';
    $('#done-extra', sheet).hidden = d.status !== 'done';
  });
  const bindStars = () => {
    sheet.querySelectorAll('[data-star]').forEach(b => b.onclick = () => { d.rating = +b.dataset.star; $('#stars-box', sheet).innerHTML = starsWidget(d.rating); bindStars(); });
    sheet.querySelector('[data-stars-clear]').onclick = () => { d.rating = 0; $('#stars-box', sheet).innerHTML = starsWidget(0); bindStars(); };
  };
  bindStars();
  sheet.querySelectorAll('[data-rw]').forEach(b => b.onclick = () => { d.rewatchCount = Math.max(0, (d.rewatchCount || 0) + +b.dataset.rw); $('#rw-val', sheet).textContent = d.rewatchCount; });
  sheet.querySelectorAll('[data-tier]').forEach(b => b.onclick = () => {
    d.tier = b.dataset.tier;
    sheet.querySelectorAll('[data-tier]').forEach(x => x.setAttribute('aria-pressed', x === b));
    $('#err-tier', sheet).hidden = true;
  });
  sheet.querySelectorAll('[data-genre]').forEach(b => b.onclick = () => {
    const g = b.dataset.genre, set = new Set(d.genres || []);
    set.has(g) ? set.delete(g) : set.add(g);
    d.genres = GENRE_LIST.filter(x => set.has(x));
    b.setAttribute('aria-pressed', set.has(g));
  });
  sheet.querySelectorAll('[data-chip]').forEach(b => b.onclick = () => {
    const on = d[f.chipKey] !== b.dataset.chip;
    d[f.chipKey] = on ? b.dataset.chip : '';
    sheet.querySelectorAll('[data-chip]').forEach(x => x.setAttribute('aria-pressed', on && x === b));
  });

  let altCtrl;
  sheet.querySelectorAll('[data-cov]').forEach(b => b.onclick = async () => {
    const what = b.dataset.cov;
    if (what === 'none') return setCover({});
    if (what === 'url') { $('#url-row', sheet).hidden = false; $('#f-url', sheet).focus(); return; }
    if (what === 'url-apply') {
      const v = $('#f-url', sheet).value.trim();
      if (/^https?:\/\//i.test(v)) { setCover({ coverUrl: v }); $('#url-row', sheet).hidden = true; }
      else toast('צריך קישור שמתחיל ב-https://');
      return;
    }
    if (what === 'upload') {
      const fileInp = $('#file-cover');
      fileInp.value = '';
      fileInp.onchange = async () => {
        if (!fileInp.files[0]) return;
        try { setCover({ coverData: await resizeFile(fileInp.files[0]) }); } catch { toast('לא הצלחתי לקרוא את התמונה'); }
      };
      fileInp.click();
      return;
    }
    if (what === 'alts') {
      const grid = $('#alt-grid', sheet);
      const title = $('#f-title', sheet).value.trim();
      if (!title) { toast('קודם כותבים שם'); return; }
      grid.hidden = false;
      grid.innerHTML = '<div class="alt-msg">מחפשת תמונות…</div>';
      altCtrl?.abort(); altCtrl = new AbortController();
      try {
        const opts = await PROVIDERS[kind].alts({ title, creator: $('#f-creator', sheet).value.trim() }, altCtrl.signal);
        grid.innerHTML = opts.length
          ? opts.map((o, i) => `<button type="button" data-alt="${i}" aria-label="תמונה ${i + 1}"><img src="${esc(o.thumb)}" alt="" loading="lazy"></button>`).join('')
          : '<div class="alt-msg">לא מצאתי תמונות נוספות. אפשר להעלות מהמכשיר.</div>';
        grid.querySelectorAll('[data-alt]').forEach(x => x.onclick = () => {
          const o = opts[+x.dataset.alt];
          setCover(o.coverId ? { coverId: o.coverId } : { coverUrl: o.coverUrl });
          grid.hidden = true;
        });
      } catch (e) { if (e.name !== 'AbortError') grid.innerHTML = '<div class="alt-msg">אין חיבור לחיפוש כרגע.</div>'; }
    }
  });

  // autocomplete
  const inp = $('#f-title', sheet), ac = $('#ac-list', sheet);
  let acTimer, acCtrl, acResults = [], active = -1;
  const closeAc = () => { ac.hidden = true; inp.setAttribute('aria-expanded', 'false'); active = -1; };
  const pick = r => {
    inp.value = r.title; d.title = r.title;
    if (r.creator) $('#f-creator', sheet).value = r.creator;
    if (r.year) d.year = r.year;
    if (!d.coverTouched && (r.coverId || r.coverUrl)) setCover(r.coverId ? { coverId: r.coverId } : { coverUrl: r.coverUrl }, false);
    closeAc();
  };
  const renderAc = () => {
    ac.innerHTML = acResults.length
      ? acResults.map((r, i) => `<button type="button" class="ac-item${i === active ? ' active' : ''}" role="option" data-i="${i}">
          <span class="ac-thumb">${r.thumb || r.coverUrl ? `<img src="${esc(r.thumb || r.coverUrl)}" alt="">` : ''}</span>
          <span class="ac-meta"><span class="ac-title"><bdi>${esc(r.title)}</bdi></span><span class="ac-sub"><bdi>${esc([r.year, r.creator || r.sub].filter(Boolean).join(' · '))}</bdi></span></span>
        </button>`).join('')
      : `<div class="ac-msg">לא מצאתי. אפשר פשוט למלא ידנית.</div>`;
    ac.querySelectorAll('[data-i]').forEach(b => b.onmousedown = e => { e.preventDefault(); pick(acResults[+b.dataset.i]); });
    ac.hidden = false; inp.setAttribute('aria-expanded', 'true');
  };
  inp.addEventListener('input', () => {
    clearTimeout(acTimer);
    const q = inp.value.trim();
    $('#err-title', sheet).hidden = true;
    if (q.length < 2) { closeAc(); return; }
    acTimer = setTimeout(async () => {
      acCtrl?.abort(); acCtrl = new AbortController();
      ac.innerHTML = '<div class="ac-msg">מחפשת…</div>'; ac.hidden = false;
      try { acResults = await PROVIDERS[kind].search(q, acCtrl.signal); active = -1; renderAc(); }
      catch (e) { if (e.name !== 'AbortError') ac.innerHTML = '<div class="ac-msg">אין חיבור לחיפוש. אפשר למלא ידנית.</div>'; }
    }, 250);
  });
  inp.addEventListener('keydown', e => {
    if (ac.hidden || !acResults.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); active = (active + (e.key === 'ArrowDown' ? 1 : -1) + acResults.length) % acResults.length; renderAc(); }
    else if (e.key === 'Enter' && active >= 0) { e.preventDefault(); pick(acResults[active]); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeAc(); }
  });
  inp.addEventListener('blur', () => setTimeout(closeAc, 150));

  $('#item-form', sheet).onsubmit = async e => {
    e.preventDefault();
    d.title = inp.value.trim();
    d.creator = $('#f-creator', sheet).value.trim();
    d.note = $('#f-note', sheet).value.trim();
    d.whyAdded = $('#f-why', sheet).value.trim();
    d.recommendedBy = $('#f-rec', sheet).value.trim();
    if (d.status === 'done') d.finishedOn = $('#f-finished', sheet).value || todayISO();
    if (!d.rating) delete d.rating;
    if (!d.title) { $('#err-title', sheet).hidden = false; inp.focus(); return; }
    if (d.status === 'done' && !d.tier) { $('#err-tier', sheet).hidden = false; $('#tier-field', sheet).scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    if (d.status !== 'done') d.tier = null;
    if (isNew && state.items.some(i => i.kind === kind && norm(i.title) === norm(d.title)) && !confirm(`"${d.title}" כבר נמצא ברשימה. להוסיף שוב?`)) return;
    const moved = isNew || d.tier !== item.tier || d.status !== item.status;
    if (moved) d.rank = nextRank();
    delete d.coverTouched;
    const btn = sheet.querySelector('.save-btn');
    btn.disabled = true; btn.textContent = 'שומרת…';
    const kept = await keepCopy(d);
    const before = state.items;
    d.updatedAt = Date.now();
    if (isNew) { d.id = uid(); d.addedAt = Date.now(); state.items = [...state.items, d]; }
    else state.items = state.items.map(i => i.id === d.id ? d : i);
    if (!(await save())) { state.items = before; btn.disabled = false; btn.textContent = 'שמירה'; return; }
    closeSheet();
    if (kind === 'game') ui.focusGame = d.id;
    const t = tierOf(kind, d.tier);
    const dest = `#/${kind}/${d.status}`;
    if (location.hash !== dest) location.hash = dest; else route();
    toast((isNew ? (t ? `נוסף לראש "${t.label}"` : 'נוסף למדף') : (moved && t ? `נשמר, ועבר לראש "${t.label}"` : 'נשמר')) + (kept ? '' : '. התמונה נשמרה כקישור בלבד'));
  };

  const del = sheet.querySelector('[data-del]');
  if (del) del.onclick = () => {
    const foot = sheet.querySelector('.sheet-foot');
    const prevFoot = foot.innerHTML;
    foot.innerHTML = `<p class="q">את בטוחה שאת רוצה למחוק את "${esc(item.title)}"?</p>
      <button type="button" class="danger-btn" data-yes>כן, למחוק</button><button type="button" class="plain-btn" data-no>לא, להשאיר</button>`;
    foot.querySelector('[data-no]').onclick = () => {
      foot.innerHTML = prevFoot;
      foot.querySelector('[data-del]').onclick = del.onclick;
      foot.querySelector('[data-del]').focus();
    };
    foot.querySelector('[data-yes]').onclick = async () => {
      const before = state.items;
      state.items = state.items.filter(i => i.id !== item.id);
      state.deleted = [...(state.deleted || []), item.id];
      if (!(await save())) { state.items = before; return; }
      closeSheet(); route();
      toast(`"${item.title}" נמחק`, { label: 'ביטול', fn: async () => { state.items = before; await save(); route(); } });
    };
    foot.querySelector('[data-no]').focus();
  };

  if (isNew) inp.focus(); else sheet.querySelector('[data-close]').focus();
}

/* ======================================================
   Item card (details fetched once, then kept with the item)
   ====================================================== */
const WD = 'https://www.wikidata.org/w/api.php?format=json&origin=*&';
const plainTitle = t => t.replace(/\s*\((\d{4})\)$/, '').replace(/\s*\([^)]*\)$/, '');
async function wikiPage(q, template) {
  const j = await (await fetch(WIKI + `generator=search&gsrlimit=1&gsrsearch=${encodeURIComponent(q + (template ? ` hastemplate:"${template}"` : ''))}&prop=extracts|langlinks|pageprops&exintro=1&explaintext=1&lllang=he&ppprop=wikibase_item`)).json();
  return Object.values(j.query?.pages || {})[0] || null;
}
async function hebrewExtract(heTitle) {
  const j = await (await fetch(`https://he.wikipedia.org/w/api.php?format=json&origin=*&action=query&prop=extracts&exintro=1&explaintext=1&redirects=1&titles=${encodeURIComponent(heTitle)}`)).json();
  return Object.values(j.query?.pages || {})[0]?.extract || '';
}
const trimText = t => { t = (t || '').replace(/\s+/g, ' ').trim(); if (t.length <= 700) return t; const cut = t.slice(0, 700); return cut.slice(0, cut.lastIndexOf('.') + 1) || cut + '…'; };
async function wikidataPeople(qids) {
  if (!qids.length) return [];
  const j = await (await fetch(WD + `action=wbgetentities&props=labels|claims&languages=he|en&ids=${qids.join('|')}`)).json();
  return qids.map(q => {
    const e = j.entities?.[q];
    const img = e?.claims?.P18?.[0]?.mainsnak?.datavalue?.value;
    return { name: e?.labels?.he?.value || e?.labels?.en?.value || '', img: img ? `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(img)}?width=128` : null };
  }).filter(p => p.name);
}
async function fetchDetails(it) {
  const det = { at: Date.now() };
  if (it.kind === 'series') {
    const s = await (await fetch(`https://api.tvmaze.com/singlesearch/shows?q=${encodeURIComponent(plainTitle(it.title))}&embed[]=cast&embed[]=crew`)).json();
    det.summary = (s.summary || '').replace(/<[^>]+>/g, ''); det.lang = 'en';
    det.runtime = s.averageRuntime || s.runtime || null;
    det.cast = (s._embedded?.cast || []).slice(0, 12).map(c => ({ name: c.person?.name, role: c.character?.name, img: c.person?.image?.medium || null }));
    det.creators = [...new Set((s._embedded?.crew || []).filter(c => /creator/i.test(c.type)).map(c => c.person?.name))].slice(0, 4);
    det.seasons = null;
    try { const se = await (await fetch(`https://api.tvmaze.com/shows/${s.id}/seasons`)).json(); det.seasons = se.length; } catch {}
    const p = await wikiPage(`${plainTitle(it.title)} TV series`, 'Infobox television').catch(() => null);
    if (p?.langlinks?.[0]) { const he = await hebrewExtract(p.langlinks[0]['*']).catch(() => ''); if (he) { det.summary = he; det.lang = 'he'; } }
  } else if (it.kind === 'movie') {
    const y = it.title.match(/\((\d{4})\)$/)?.[1] || it.year || '';
    const p = await wikiPage(`${plainTitle(it.title)} ${y}`, 'Infobox film');
    det.summary = p?.extract || ''; det.lang = 'en';
    if (p?.langlinks?.[0]) { const he = await hebrewExtract(p.langlinks[0]['*']).catch(() => ''); if (he) { det.summary = he; det.lang = 'he'; } }
    const q = p?.pageprops?.wikibase_item;
    if (q) {
      const j = await (await fetch(WD + `action=wbgetentities&props=claims&ids=${q}`)).json();
      const c = j.entities?.[q]?.claims || {};
      const amt = c.P2047?.[0]?.mainsnak?.datavalue?.value?.amount;
      if (amt) det.runtime = Math.round(Math.abs(parseFloat(amt)));
      const ids = p => (c[p] || []).map(x => x.mainsnak?.datavalue?.value?.id).filter(Boolean);
      det.directors = (await wikidataPeople(ids('P57').slice(0, 3))).map(x => x.name);
      det.cast = await wikidataPeople(ids('P161').slice(0, 10));
    }
  } else if (it.kind === 'book') {
    const p = await wikiPage(`${plainTitle(it.title)} ${it.creator || ''} novel`, 'Infobox book').catch(() => null);
    if (p?.langlinks?.[0]) { const he = await hebrewExtract(p.langlinks[0]['*']).catch(() => ''); if (he) { det.summary = he; det.lang = 'he'; } }
    if (!det.summary) {
      const s = await (await fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(it.title)}${it.creator ? '&author=' + encodeURIComponent(it.creator) : ''}&limit=1&fields=key,number_of_pages_median`)).json();
      const d0 = s.docs?.[0];
      if (d0) {
        det.pages = d0.number_of_pages_median || null;
        const w = await (await fetch(`https://openlibrary.org${d0.key}.json`)).json();
        det.summary = typeof w.description === 'string' ? w.description : w.description?.value || ''; det.lang = 'en';
      }
      if (!det.summary && p?.extract) { det.summary = p.extract; det.lang = 'en'; }
    }
  }
  det.summary = trimText(det.summary);
  return det;
}

const FORMAT_LABEL = Object.fromEntries(FORM.book.chips);
function openDetail(it) {
  if (it.kind === 'game') return openItemSheet('game', it);
  const k = KINDS[it.kind], t = tierOf(it.kind, it.tier), d = it.details;

  const src = coverSrc(it);
  const prog = it.progress || {};
  openSheet(it.kind, esc(k.one), `
    <div class="dt-hero">
      ${src ? `<div class="dt-hero-bg" style="background-image:url('${esc(src)}')"></div>` : ''}
      ${coverBox(it)}
      <h2 class="dt-title"><bdi>${esc(it.title)}</bdi></h2>

    ${it.kind === 'series' || it.kind === 'movie' ? `<p class="dt-muted" style="margin:18px 0 0;font-size:12px">מידע: ${it.kind === 'series' ? 'TVmaze, ' : ''}Wikipedia, Wikidata</p>` : ''}`,

      : `<button type="button" class="save-btn" data-dt-edit>עריכה</button>${it.status !== 'done' ? `<button type="button" class="plain-btn" data-dt-done>✓ ${k.done}</button>` : ''}<span class="grow"></span><button type="button" class="plain-btn" data-close>סגירה</button>`);
  if (it.preview) { sheet.querySelector('[data-dt-want]').onclick = () => addFromPreview(it, 'want'); sheet.querySelector('[data-dt-seen]').onclick = () => addFromPreview(it, 'done'); }
  sheet.querySelector('[data-close]').onclick = closeSheet;
  const ed = sheet.querySelector('[data-dt-edit]'); if (ed) ed.onclick = () => openItemSheet(it.kind, it);
  const done = sheet.querySelector('[data-dt-done]'); if (done) done.onclick = () => openQuickDone(it);
  sheet.querySelectorAll('[data-pg]').forEach(b => b.onclick = async () => {
    const p = it.progress = { s: 1, e: 0, ...(it.progress || {}) };
    p[b.dataset.pg] = Math.max(b.dataset.pg === 's' ? 1 : 0, p[b.dataset.pg] + +b.dataset.d);
    if (b.dataset.pg === 's' && +b.dataset.d > 0) p.e = 0;
    $('#pg-s', sheet).textContent = p.s; $('#pg-e', sheet).textContent = p.e;
    if (it.status === 'want' && (p.e > 0 || p.s > 1)) { it.status = 'inProgress'; it.rank = nextRank(); }
    await save();
  });
  sheet.querySelectorAll('[data-fmt]').forEach(b => b.onclick = async () => {
    it.format = b.dataset.fmt;
    sheet.querySelectorAll('[data-fmt]').forEach(x => x.setAttribute('aria-pressed', x === b));

  // fill in details the first time (and refresh anything older than ~2 months)
  if (!d || Date.now() - d.at > 60 * 864e5) fetchDetails(it).then(async det => {
    it.details = det; await save();
    if (!sheet.open || !$('#dt-sum', sheet)) return;
    openDetail(it);
  }).catch(() => { const s = $('#dt-sum', sheet); if (s && !d) s.innerHTML = '<span class="dt-muted">אין חיבור כרגע. ננסה שוב בפעם הבאה.</span>'; });
}

/* ======================================================
   Paste a whole list
   ====================================================== */
function openBulkSheet(kind, status = 'done') {
  const k = KINDS[kind];
  let st = status === 'dropped' ? 'done' : status;
  openSheet(kind, `הדבקת רשימת ${k.label}`, `
    <div class="field">
      <label for="f-bulk">שם בכל שורה. מספור ונקודות מתנקים לבד.${kind === 'book' ? ' אפשר גם "שם - סופר/ת".' : ''}</label>
      <textarea class="inp" id="f-bulk" dir="auto" placeholder="${kind === 'book' ? 'Piranesi - Susanna Clarke' : 'The Office'}&#10;…"></textarea>
    </div>
    <div class="field">
      <span class="lbl" id="lbl-bst">לאיזה מדף</span>
      <div class="opts" role="group" aria-labelledby="lbl-bst">${['done', 'want', 'inProgress'].map(s => `<button type="button" class="opt" data-bst="${s}" aria-pressed="${st === s}">${statusLabel(kind, s)}</button>`).join('')}</div>
    </div>
    <p style="margin:0;color:var(--s-text-2);font-size:14px">תמונות נמצאות לבד ברקע. מה שכבר נמצא אצלך לא ייכנס פעמיים. אחרי "${k.done}" נפתח דירוג בסוויפ.</p>`,
    `<button type="button" class="save-btn" data-go-bulk>הוספה</button><span class="grow"></span><button type="button" class="plain-btn" data-close>ביטול</button>`);
  sheet.querySelectorAll('[data-bst]').forEach(b => b.onclick = () => { st = b.dataset.bst; sheet.querySelectorAll('[data-bst]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $('#f-bulk', sheet).focus();
  sheet.querySelector('[data-go-bulk]').onclick = async () => {
    const lines = $('#f-bulk', sheet).value.split(/\r?\n/)
      .map(l => l.replace(/^\s*(?:\d+[.)\-:]|[-•*])\s*/, '').replace(/\*+$/, '').trim()).filter(Boolean);
    if (!lines.length) { toast('הרשימה ריקה'); return; }
    const have = new Set(itemsOf(kind).map(i => norm(i.title)));
    const fresh = [];
    let dup = 0;
    for (const raw of lines) {
      const m = kind === 'book' ? raw.match(/^(.*?)\s+[-–—]\s+(.+)$/) : null;
      const title = (m ? m[1] : raw).trim(), creator = m ? m[2].trim() : '';
      if (have.has(norm(title))) { dup++; continue; }
      have.add(norm(title));
      fresh.push({ id: uid(), kind, title, creator, status: st, tier: null, note: '', needsCover: true, addedAt: Date.now(), ...(FORM[kind].chipKey ? { [FORM[kind].chipKey]: FORM[kind].defaultChip } : {}) });
    }
    // Ranks follow her order: the swipe deck goes top-down, shelves show the last line first.
    let r = nextRank();
    fresh.forEach(i => { i.rank = r++; });
    const before = state.items;
    state.items = [...state.items, ...fresh];
    if (!(await save())) { state.items = before; return; }
    closeSheet();
    location.hash = `#/${kind}/${st}`;
    route();
    toast(`נוספו ${fresh.length}${dup ? `, ${dup} כבר היו` : ''}`);
    backgroundCovers();
    if (st === 'done' && fresh.length) openSwipe(kind, fresh.map(i => i.id));
  };
}

/* ======================================================
   Home search (her own library)
   ====================================================== */
const hasHebrew = s => /[\u0590-\u05FF]/.test(s);
// Hebrew query → English titles via Hebrew Wikipedia's links (movies, series, games are indexed in English)
async function hebrewToEnglish(q, signal) {
  const j = await (await fetch(`https://he.wikipedia.org/w/api.php?format=json&origin=*&action=query&generator=search&gsrlimit=3&gsrsearch=${encodeURIComponent(q)}&prop=langlinks&lllang=en`, { signal })).json();
  return Object.values(j.query?.pages || {}).sort((x, y) => x.index - y.index).map(p => p.langlinks?.[0]?.['*']).filter(Boolean).map(t => t.replace(/\s*\([^)]*\)$/, ''));
}
// loose match for typos in her own library: every query letter appears in order
const fuzzy = (q, t) => { let i = 0; for (const ch of t) if (ch === q[i]) i++; return i === q.length; };
async function searchEverywhere(q, signal) {
  const per = { movie: 2, series: 2, book: 2, game: 2 };
  let queries = { movie: q, series: q, book: q, game: q };
  const run = async qs => {
    const out = {};
    await Promise.all(KIND_ORDER.map(async k => { try { out[k] = (await PROVIDERS[k].search(qs[k], signal)).slice(0, per[k]); } catch (e) { if (e.name === 'AbortError') throw e; out[k] = []; } }));
    return out;
  };
  let res = await run(queries);
  // nothing for Hebrew text? try the English name of the same title
  if (hasHebrew(q) && ['movie', 'series', 'game'].some(k => !res[k].length)) {
    const en = (await hebrewToEnglish(q, signal).catch(() => []))[0];
    if (en) {
      const more = await run({ movie: en, series: en, book: q, game: en });
      for (const k of ['movie', 'series', 'game']) if (!res[k].length) res[k] = more[k];
    }
  }
  // still nothing? maybe a typo — ask Wikipedia's spell-checker for the likely name and try again
  if (KIND_ORDER.every(k => !res[k].length)) {
    const host = hasHebrew(q) ? 'he' : 'en';
    const j = await (await fetch(`https://${host}.wikipedia.org/w/api.php?format=json&origin=*&action=opensearch&limit=1&profile=fuzzy&search=${encodeURIComponent(q)}`, { signal })).json().catch(() => null);
    const fixed = j?.[1]?.[0]?.replace(/\s*\([^)]*\)$/, '');
    if (fixed && fixed !== q) { res = await run({ movie: fixed, series: fixed, book: fixed, game: fixed }); res.fixedQuery = fixed; }
  }
  return res;
}
function previewItem(kind, r) {
  return { id: 'preview-' + uid(), kind, title: r.title, creator: r.creator || '', year: r.year || null, coverId: r.coverId || undefined, coverUrl: r.coverUrl || undefined, status: 'want', tier: null, note: '', preview: true };
}
async function addFromPreview(it, status) {
  if (state.items.some(i => i.kind === it.kind && norm(i.title) === norm(it.title)) && !confirm(`"${it.title}" כבר נמצא ברשימה. להוסיף שוב?`)) return;
  const fresh = { ...it, id: uid(), status, tier: null, rank: nextRank(), addedAt: Date.now(), ...(FORM[it.kind].chipKey ? { [FORM[it.kind].chipKey]: FORM[it.kind].defaultChip } : {}) };
  delete fresh.preview;
  await keepCopy(fresh);
  state.items = [...state.items, fresh];
  if (!(await save())) { state.items = state.items.filter(i => i !== fresh); return; }
  route();
  if (status === 'done') openQuickDone(fresh); else { closeSheet(); toast(`נוסף ל"${KINDS[it.kind].want}"`); }
}

function openSearch() {
  openSheet(null, 'חיפוש', `
    <div class="field"><label class="sr-only" for="f-q">חיפוש</label><input class="inp" id="f-q" type="search" placeholder="סרט, סדרה, ספר או משחק, בעברית או באנגלית" autocomplete="off"></div>
    <div id="q-res"></div>`, `<span class="grow"></span><button type="button" class="plain-btn" data-close>סגירה</button>`);
  const q = $('#f-q', sheet), res = $('#q-res', sheet);
  q.focus();
  let timer, ctrl, latest = [];
  const row = (kind, r, i) => `<button class="res-item" data-pick="${i}">
      <span class="cv" data-kind="${kind}">${r.thumb || r.coverUrl ? `<img src="${esc(r.thumb || r.coverUrl)}" alt="" loading="lazy">` : ''}</span>
      <span><b><bdi>${esc(r.title)}</bdi></b><br><small>${KINDS[kind].one}${r.year ? ' · ' + r.year : ''}${r.creator || r.sub ? ' · <bdi>' + esc(r.creator || r.sub) + '</bdi>' : ''}</small></span></button>`;
  const draw = (local, remote, loading) => {
    latest = [];
    let html = '';
    if (local.length) html += `<div class="res-group"><h3>אצלי על המדפים</h3>${local.map(i => `<button class="res-item" data-res="${esc(i.id)}">${coverBox(i)}<span><b><bdi>${esc(i.title)}</bdi></b><br><small>${KINDS[i.kind].one} · ${statusLabel(i.kind, i.status)}${i.tier ? ' · ' + tierOf(i.kind, i.tier).label : ''}</small></span></button>`).join('')}</div>`;
    if (remote) for (const k of KIND_ORDER) if (remote[k]?.length) {
      html += `<div class="res-group" data-kind="${k}"><h3>${KINDS[k].label}</h3>${remote[k].map(r => { latest.push([k, r]); return row(k, r, latest.length - 1); }).join('')}</div>`;
    }
    if (remote?.fixedQuery) html = `<p class="dt-muted">אולי התכוונת ל-<bdi>${esc(remote.fixedQuery)}</bdi>:</p>` + html;
    if (loading) html += '<p class="dt-muted">מחפשת…</p>';
    if (!loading) html += `<div class="res-group"><h3>לא מצאתי?</h3><div class="opts">${KIND_ORDER.map(k => `<button class="opt" data-add-kind="${k}">הוספה ידנית: ${KINDS[k].one}</button>`).join('')}</div></div>`;
    res.innerHTML = html;
    res.querySelectorAll('[data-res]').forEach(b => b.onclick = () => openDetail(findItem(b.dataset.res)));
    res.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { const [k, r] = latest[+b.dataset.pick]; openDetail(previewItem(k, r)); });
    res.querySelectorAll('[data-add-kind]').forEach(b => b.onclick = () => { const v = q.value; openItemSheet(b.dataset.addKind, null, 'want'); const t = $('#f-title', sheet); t.value = v; });
  };
  q.oninput = () => {
    clearTimeout(timer);
    const raw = q.value.trim(), s = norm(raw);
    if (s.length < 2) { res.innerHTML = ''; return; }
    const local = state.items.filter(i => norm(i.title).includes(s) || norm(i.creator || '').includes(s)).slice(0, 6);
    const loose = local.length ? [] : state.items.filter(i => fuzzy(s, norm(i.title))).slice(0, 4);
    draw([...local, ...loose], null, true);
    timer = setTimeout(async () => {
      ctrl?.abort(); ctrl = new AbortController();
      try { const remote = await searchEverywhere(raw, ctrl.signal); if (q.value.trim() === raw) draw([...local, ...loose], remote, false); }
      catch (e) { if (e.name !== 'AbortError') draw([...local, ...loose], null, false); }
    }, 250);
  };
}

/* ======================================================
   Swipe deck — right: loved, left: disliked, middle button / up: the in-between
   ====================================================== */
const swipeDlg = $('#swipe');
function openSwipe(kind, ids) {
  const queue = (ids ? ids.map(findItem).filter(Boolean) : itemsOf(kind)).filter(isUnrated).sort((a, b) => (a.rank ?? 0) - (b.rank ?? 0));
  if (!queue.length) { toast('אין מה לדרג כרגע'); return; }
  const total = queue.length;
  const history = [];
  const tally = Object.fromEntries(TIERS[kind].map(t => [t.key, 0]));
  const tiers = TIERS[kind];
  const LOVE = tiers[0], NOPE = tiers.at(-1), MIDS = tiers.slice(1, -1), MID = MIDS[0];
  let pos = 0, busy = false;

  swipeDlg.innerHTML = `<div class="sw-wrap" data-kind="${kind}">
    <div class="sw-bg" id="sw-bg"></div>
    <div class="sw-top">
      <button class="x" data-sw-close aria-label="סגירה">${IC.x}</button>
      <div class="sw-prog"><b id="sw-count"></b><div class="sw-bar"><span id="sw-bar"></span></div><div class="sw-tally" id="sw-tally"></div></div>
      <button class="undo" data-sw-undo aria-label="ביטול הדירוג האחרון" disabled>${IC.undo}</button>
    </div>
    <div class="sw-stage" id="sw-stage"></div>
    <div id="sw-controls">
      <div class="sw-btns">
        <button class="sw-b big nope" data-sw="${NOPE.key}" aria-label="${NOPE.label}">${IC.nope}</button>
        ${MIDS.map(m => `<button class="sw-b mid" data-sw="${m.key}">${m.label}</button>`).join('')}
        <button class="sw-b big love" data-sw="${LOVE.key}" aria-label="${LOVE.label}">${IC.heart}</button>
      </div>
      <button class="sw-skip" data-sw-skip>לא זוכרת, דלגי</button>
      <p class="sw-hint">אפשר גם לגרור: ימינה אהבתי, שמאלה לא אהבתי, למעלה ${MID.label}${MIDS.length > 1 ? ', ובכפתורים גם ' + MIDS.slice(1).map(m => m.label).join(', ') : ''}</p>
    </div>
  </div>`;
  const stage = $('#sw-stage', swipeDlg);

  const cardHTML = (it, cls = '') => `<div class="sw-card ${cls}" data-id="${esc(it.id)}">
      ${coverBox(it)}
      <span class="stamp love">${LOVE.label}</span><span class="stamp nope">${NOPE.label}</span><span class="stamp mid">${MID.label}</span>
      <div class="sw-info"><h3><bdi>${esc(it.title)}</bdi></h3><p><bdi>${esc(SUBLINE(it))}</bdi></p></div>
    </div>`;
  const paint = () => {
    $('#sw-count', swipeDlg).textContent = `${Math.min(pos + 1, total)} מתוך ${total}`;
    $('#sw-bar', swipeDlg).style.width = (pos / total * 100) + '%';
    $('#sw-tally', swipeDlg).innerHTML = TIERS[kind].map(t => `<span>${t.icon} ${tally[t.key]}</span>`).join('');
    swipeDlg.querySelector('[data-sw-undo]').disabled = !history.length;
    const cur = queue[pos], nxt = queue[pos + 1];
    if (!cur) {
      $('#sw-controls', swipeDlg).hidden = true;
      stage.innerHTML = `<div class="sw-done"><h3>סיימת!</h3><p>${TIERS[kind].map(t => `${tally[t.key]} ${t.label}`).join(', ')}.</p><button data-sw-close>לראות את המדף</button></div>`;
      return;
    }
    $('#sw-controls', swipeDlg).hidden = false;
    stage.innerHTML = (nxt ? cardHTML(nxt, 'next') : '') + cardHTML(cur);
    const src = coverSrc(cur);
    $('#sw-bg', swipeDlg).style.backgroundImage = src ? `url("${src.replace(/"/g, '%22')}")` : 'none';
    bindDrag(stage.querySelector('.sw-card:not(.next)'));
  };

  async function decide(tierKey, dir) {
    if (busy) return;
    const it = queue[pos];
    if (!it) return;
    busy = true;
    const card = stage.querySelector('.sw-card:not(.next)');
    const out = dir || (tierKey === LOVE.key ? 'right' : tierKey === NOPE.key ? 'left' : 'up');
    const midStamp = card?.querySelector('.stamp.mid');
    if (midStamp && out === 'up') midStamp.textContent = tierOf(kind, tierKey).label;
    const to = { right: { x: innerWidth, rotation: 24 }, left: { x: -innerWidth, rotation: -24 }, up: { y: -innerHeight, rotation: 0 }, skip: { y: innerHeight * .2, opacity: 0 } }[out];
    if (card) {
      if (tierKey) card.querySelector({ right: '.stamp.love', left: '.stamp.nope', up: '.stamp.mid' }[out]).style.opacity = 1;
      // never wait on the animation for longer than it should take (background tabs pause it)
      if (window.gsap && !reducedMotion()) await Promise.race([new Promise(r => gsap.to(card, { ...to, duration: .38, ease: 'power2.in', onComplete: r })), sleep(450)]);
    }
    history.push({ id: it.id, tier: it.tier, rank: it.rank, pos });
    if (tierKey) { it.tier = tierKey; it.rank = nextRank(); it.updatedAt = Date.now(); tally[tierKey]++; await save(); }
    pos++;
    busy = false;
    paint();
  }
  async function undo() {
    const h = history.pop();
    if (!h) return;
    const it = findItem(h.id);
    if (it.tier) tally[it.tier]--;
    it.tier = h.tier; it.rank = h.rank;
    pos = h.pos;
    await save();
    paint();
  }
  function bindDrag(card) {
    if (!card) return;
    let sx = 0, sy = 0, dx = 0, dy = 0, dragging = false;
    const stamps = { love: card.querySelector('.stamp.love'), nope: card.querySelector('.stamp.nope'), mid: card.querySelector('.stamp.mid') };
    card.addEventListener('pointerdown', e => { dragging = true; sx = e.clientX; sy = e.clientY; card.setPointerCapture(e.pointerId); card.style.transition = 'none'; });
    card.addEventListener('pointermove', e => {
      if (!dragging) return;
      dx = e.clientX - sx; dy = e.clientY - sy;
      card.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 18}deg)`;
      stamps.love.style.opacity = Math.max(0, Math.min(1, dx / 110));
      stamps.nope.style.opacity = Math.max(0, Math.min(1, -dx / 110));
      stamps.mid.style.opacity = Math.abs(dx) < 60 ? Math.max(0, Math.min(1, -dy / 130)) : 0;
    });
    const end = () => {
      if (!dragging) return;
      dragging = false;
      if (dx > 110) decide(LOVE.key, 'right');
      else if (dx < -110) decide(NOPE.key, 'left');
      else if (dy < -130 && Math.abs(dx) < 80) decide(MID.key, 'up');
      else {
        card.style.transition = 'transform .35s cubic-bezier(.2,.9,.3,1.3)';
        card.style.transform = '';

  swipeDlg.onclick = e => {
    const b = e.target.closest('[data-sw],[data-sw-undo],[data-sw-skip],[data-sw-close]');
    if (!b) return;

    if (e.key === 'ArrowRight') { e.preventDefault(); decide(LOVE.key, 'right'); }

    if (e.key === 'ArrowUp') { e.preventDefault(); decide(MID.key, 'up'); }
    if (e.key === 'Backspace') { e.preventDefault(); undo(); }
  };
  swipeDlg.onclose = () => { swipeDlg.innerHTML = ''; route(); };
  paint();
  swipeDlg.showModal();

}

// Uniform integer in [0, n) — rejection sampling, so no modulo bias.
function randomIndex(n) {

        imgs += `<g class="slice-img" data-i="${i}"><circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="${(r + 2.5).toFixed(1)}" fill="#fff"/><image href="${esc(src)}" x="${(tx - r).toFixed(1)}" y="${(ty - r * 1.5).toFixed(1)}" width="${(2 * r).toFixed(1)}" height="${(3 * r).toFixed(1)}" preserveAspectRatio="xMidYMid slice" clip-path="url(#whc${i})" transform="rotate(${mid.toFixed(1)} ${tx.toFixed(1)} ${ty.toFixed(1)})"/></g>`;

    <defs>

    <circle cx="${C}" cy="${CY}" r="${R + 24}" fill="url(#wh-metal)"/>

// Automatic fairness checks (run on every load): 10,000 spins over 20 items, and the wheel draws one slice per item.
function wheelSelfTest() {
  const n = 20, spins = 10000, counts = new Array(n).fill(0);
  for (let i = 0; i < spins; i++) counts[randomIndex(n)]++;
  const spread = counts.every(c => c >= 400 && c <= 600) && counts.every(c => c > 0);
  const fake = Array.from({ length: n }, (_, i) => ({ title: 'פריט ' + i }));
  const box = document.createElement('div'); box.innerHTML = wheelSVG(fake);
  const drawn = box.querySelectorAll('.slice').length === n;
  const big = Array.from({ length: 137 }, (_, i) => ({ title: 'x' + i }));
  box.innerHTML = wheelSVG(big);
  const drawnBig = box.querySelectorAll('.slice').length === 137;
  const ok = spread && drawn && drawnBig;
  console[ok ? 'info' : 'error']('wheel self-test', { ok, counts, min: Math.min(...counts), max: Math.max(...counts), drawn, drawnBig });
  return { ok, min: Math.min(...counts), max: Math.max(...counts) };
}

let spinning = false;
async function spinWheel() {
  if (spinning) return;
  const pool = wheelPool();
  if (!pool.length) return;
  spinning = true;
  // 1) the draw — uniform over every item in the pool
  const idx = randomIndex(pool.length);
  const chosen = pool[idx];
  // 2) the show — rotate so the chosen slice stops under the pointer
  const n = pool.length, a = 360 / n;
  const jitter = (randomIndex(1000) / 1000 - .5) * a * .7;
  const stage = $('.wh-stage', wheelDlg), rot = $('.wh-rot', wheelDlg), pointer = $('.wh-pointer', wheelDlg);
  stage.classList.remove('wh-slice-dim', 'flash');
  $$('.win', stage).forEach(x => x.classList.remove('win'));
  const current = ui.wheelRot || 0;
  const target = current - (current % 360) + 360 * 7 + (360 - (idx + .5) * a) + jitter;
  ui.wheelRot = target;
  $('#wh-result', wheelDlg).innerHTML = '';
  wheelDlg.querySelectorAll('[data-wh="spin"]').forEach(b => { b.disabled = true; });
  const ticker = $('#wh-ticker', wheelDlg);
  let tick = null;
  if (n > 24 && ticker) { let k = 0; tick = setInterval(() => { ticker.textContent = pool[k++ % n].title; }, 60); }
  // bulbs chase while it turns
  stage.classList.add('spinning');
  const bulbs = $$('.wh-bulb', stage); let step = 0;
  const chase = setInterval(() => { bulbs.forEach((b, k) => b.classList.toggle('on', (k + step) % 3 === 0)); step++; }, 90);
  const dur = reducedMotion() ? 0 : 5.2;
  let lastSlice = -1;
  if (window.gsap && dur) {
    // spin around the true centre of the wheel (not the corner of its slices)
    await Promise.race([new Promise(r => gsap.to(rot, {
      svgOrigin: rot.dataset.c,
      rotation: target, duration: dur, ease: 'power4.out', onComplete: r,
      onUpdate() {
        // the pointer flicks each time a slice edge passes under it
        const deg = ((gsap.getProperty(rot, 'rotation') % 360) + 360) % 360;
        const under = Math.floor(((360 - deg) % 360) / a);
        if (under !== lastSlice && n <= 60) { lastSlice = under; gsap.fromTo(pointer, { rotation: -16 }, { rotation: 0, duration: .18, ease: 'back.out(3)', overwrite: true }); }
      },
    })), sleep(dur * 1000 + 500)]);
  } else rot.style.transform = `rotate(${target}deg)`;
  if (window.gsap) gsap.set(rot, { rotation: target, svgOrigin: rot.dataset.c });
  clearInterval(chase); stage.classList.remove('spinning');
  if (tick) clearInterval(tick);
  if (ticker && n > 24) ticker.textContent = chosen.title;
  // the winner lights up
  $$(`[data-i="${idx}"]`, stage).forEach(x => x.classList.add('win'));
  stage.classList.add('wh-slice-dim', 'flash');
  setTimeout(() => stage.classList.remove('flash'), 1200);
  if (!reducedMotion() && window.gsap) celebrate(stage);
  wheelDlg.querySelectorAll('[data-wh="spin"]').forEach(b => { b.disabled = false; });
  spinning = false;
  if (wheelState.excludeNext) wheelState.excluded.add(chosen.id);
  showWheelResult(chosen);
}
function celebrate(stage) {
  const cols = ['#E63946', '#FFD23F', '#3BB273', '#1FA9C9', '#8E44AD', '#F4A21E'];
  for (let i = 0; i < 26; i++) {
    const c = Object.assign(document.createElement('span'), { className: 'confetti' });
    c.style.background = cols[i % cols.length];
    stage.append(c);

wheelDlg.addEventListener('click', async e => {

  else if (fileSync.handle) fileLine = `<p>השמירה לקובץ <bdi>${esc(fileSync.handle.name)}</bdi> מחכה לאישור שלך.</p><button class="ghost-btn strong" data-action="file-resume">להמשיך לשמור לקובץ</button>`;
  else fileLine = `<p>אפשר לחבר קובץ בתיקייה, וכל שינוי יישמר בו גם כן.</p><button class="ghost-btn strong" data-action="file-connect">חיבור קובץ שמירה</button>`;
  const place = location.protocol === 'file:' ? 'בקובץ index.html שבתיקייה, בדפדפן הזה' : `בכתובת ${location.host}${location.pathname.replace(/index\.html$/, '')}, בדפדפן הזה`;
  return `<section class="safety">
    <h2 class="sec-title">השמירה שלי</h2>
    <p><b>הנתונים שלך שמורים ${esc(place)}.</b> כל כתובת וכל מכשיר שומרים עותק נפרד. להעברה: "גיבוי לקובץ" כאן, ו"שחזור מגיבוי" במקום השני.</p>
    ${fileLine}
    <div class="home-foot">
      <button class="ghost-btn" data-action="export">גיבוי לקובץ</button>
      <button class="ghost-btn" data-action="import">שחזור מגיבוי</button>
      <button class="ghost-btn" data-action="versions">גרסאות קודמות</button>
    </div>
  </section>`;
}
async function openVersions() {
  const snaps = await listSnapshots();
  const fmt = t => new Date(t).toLocaleString('he-IL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
  const count = s => KIND_ORDER.map(k => `${s.items.filter(i => i.kind === k).length} ${KINDS[k].label}`).join(', ');
  openSheet(null, 'גרסאות קודמות', snaps.length
    ? `<p style="margin:0 0 12px;color:var(--s-text-2)">המדף שומר לבד עותק לפני כל עדכון ופעם ביום. שחזור מחליף את מה שיש עכשיו, ולפני כן נשמר עותק גם ממנו.</p>
       ${snaps.map((s, i) => `<button class="res-item" data-snap="${i}"><span><b>${fmt(s.at)}</b> · ${esc(s.why)}<br><small>${count(s.state)}</small></span></button>`).join('')}`
    : '<p>עוד אין גרסאות שמורות. הראשונה תישמר היום.</p>',
    `<span class="grow"></span><button type="button" class="plain-btn" data-close>סגירה</button>`);
  sheet.querySelectorAll('[data-snap]').forEach(b => b.onclick = async () => {
    const s = snaps[+b.dataset.snap];
    if (!confirm(`לשחזר את הגרסה מ-${fmt(s.at)}?`)) return;
    await snapshot(state, 'לפני שחזור');
    state = migrate(JSON.parse(JSON.stringify(s.state)));
    state.replaced = true;
    if (await save()) { closeSheet(); route(); toast('הגרסה שוחזרה'); }
  });
}

function importBackup() {
  const inp = $('#file-backup');
  inp.value = '';
  inp.onchange = async () => {
    if (!inp.files[0]) return;
    let data;
    try { data = JSON.parse(await inp.files[0].text()); } catch { toast('זה לא קובץ גיבוי תקין'); return; }
    if (data?.app !== 'madaf' || !Array.isArray(data.items)) { toast('זה לא קובץ גיבוי של המדף'); return; }
    const n = k => data.items.filter(i => i.kind === k).length;
    if (!confirm(`בגיבוי: ${n('book')} ספרים, ${n('series')} סדרות, ${n('game')} משחקים, ${n('movie')} סרטים.\nמה שיש עכשיו יוחלף, ולפני כן יירד גיבוי שלו. להמשיך?`)) return;
    downloadBackup();
    const before = state;
    state = migrate({ ...data, settings: data.settings || state.settings });
    state.replaced = true; // a restore replaces everything on purpose
    if (!(await save())) { state = before; return; }
    route();
    toast('השחזור הצליח');
  };
  inp.click();
}

/* ======================================================
   Router + events
   ====================================================== */
function openCurtains() {
  const drapes = $('.drape'), ties = $('.tieback');
  if (!drapes.length) return;
  drapes.forEach(d => d.classList.add('closed'));
  ties.forEach(t => { t.style.opacity = 0; });
  const finish = () => { drapes.forEach(d => { d.style.transition = ''; d.classList.remove('closed'); }); ties.forEach(t => { t.style.transition = 'opacity .4s'; t.style.opacity = 1; }); };
  requestAnimationFrame(() => requestAnimationFrame(() => {
    drapes.forEach(d => { d.style.transition = 'clip-path 1.6s cubic-bezier(.65, 0, .25, 1) .35s'; d.classList.remove('closed'); });
    setTimeout(() => ties.forEach(t => { t.style.transition = 'opacity .5s'; t.style.opacity = 1; }), 1700);
  }));
  setTimeout(finish, 2600); // in case the tab was in the background
}
let staticURL = null;
function tvStatic() {
  const el = $('.crt .tv-static');
  if (!el) return;
  if (!staticURL) {
    const c = Object.assign(document.createElement('canvas'), { width: 200, height: 200 });
    const x = c.getContext('2d'), img = x.createImageData(200, 200);
    const buf = new Uint8Array(200 * 200); crypto.getRandomValues(buf);
    for (let i = 0; i < buf.length; i++) { const v = buf[i]; img.data.set([v, v, v, 255], i * 4); }
    x.putImageData(img, 0, 0); staticURL = c.toDataURL();
  }
  el.style.backgroundImage = `url(${staticURL})`;
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
}
function setThemeColor(c) { document.querySelector('meta[name="theme-color"]').content = c; }
function route() {
  teardown();
  let [kind, status] = location.hash.replace(/^#\/?/, '').split('/');
  const app = $('#app');
  if (!KINDS[kind]) {
    document.body.dataset.dark = '0';
    renderTabbar('home');
    app.innerHTML = renderHome();
    document.title = 'המדף של עדי';
    setThemeColor('#FBF8FF');
    return;
  }
  if (!STATUSES.includes(status)) {
    const all = itemsOf(kind);
    status = all.some(i => i.status === 'done') ? 'done' : STATUSES.find(s => all.some(i => i.status === s)) || 'want';
  }
  const dark = kind !== 'movie' || true ? (kind === 'game' || kind === 'movie' || (kind === 'book' && bookTheme().dark)) : false;
  const prevKind = ui.lastKind, prevStatus = ui.lastStatus;
  ui.lastKind = kind; ui.lastStatus = status;
  document.body.dataset.dark = dark ? '1' : '0';
  renderTabbar(kind);
  app.innerHTML = kind === 'book' ? renderBooks(status) : kind === 'game' ? renderGames(status) : renderMedia(kind, status);
  document.title = `${KINDS[kind].label} · המדף של עדי`;
  setThemeColor({ game: '#060b19', book: bookTheme().color, movie: '#6E0E1C', series: '#E9B949' }[kind]);
  if (kind === 'book' || kind === 'game') enhance(kind);
  if (kind === 'movie' && prevKind !== 'movie' && !reducedMotion()) openCurtains();
  if (kind === 'series' && prevKind === 'series' && prevStatus !== status && !reducedMotion()) tvStatic();
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-go],[data-action]');
  if (!el || el.closest('#sheet, #swipe')) return;
  if (el.dataset.go) {
    const target = el.dataset.go;
    if (location.hash === target || (target === '#/' && !location.hash)) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    const inPage = el.closest('[role="tablist"]');
    location.hash = target;
    if (!inPage) window.scrollTo({ top: 0 });
    return;
  }
  const a = el.dataset.action;
  const kind = el.dataset.kind || el.closest('[data-kind]')?.dataset.kind;
  if (a === 'search') openSearch();
  if (a === 'add') openItemSheet(kind, null, el.dataset.status || 'done');
  if (a === 'bulk') openBulkSheet(kind, el.dataset.status || 'done');
  if (a === 'swipe') openSwipe(kind);
  if (a === 'wheel') openWheel(kind);
  if (a === 'edit') { const it = findItem(el.dataset.id); if (it) openDetail(it); }
  if (a === 'quick-done') { const it = findItem(el.dataset.id); if (it) openQuickDone(it); }
  if (a === 'focus-game') {
    if (ui.focusGame === el.dataset.id) { const it = findItem(el.dataset.id); if (it) openItemSheet('game', it); }
    else focusGame(el.dataset.id);
  }
  if (a === 'book-theme') { state.settings.bookTheme = el.dataset.theme; save(); route(); $(`[data-theme="${el.dataset.theme}"]`)?.focus({ preventScroll: true }); }
  if (a === 'copy') {
    const n = itemsOf(kind).filter(i => i.status === 'done' && i.tier).length;
    toast(await copyText(listText(kind)) ? `הרשימה הועתקה (${n})` : 'לא הצלחתי להעתיק');
  }
  if (a === 'export') downloadBackup();
  if (a === 'import') importBackup();
  if (a === 'file-connect') fileSync.connect();
  if (a === 'file-resume') fileSync.resume();
  if (a === 'versions') openVersions();
});
document.addEventListener('change', e => {
  if (e.target.dataset.action === 'sort') { ui.sort[e.target.dataset.kind] = e.target.value; route(); $('#sort-' + e.target.dataset.kind)?.focus(); }
});
window.addEventListener('hashchange', route);
let resizeT;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { if (location.hash.startsWith('#/book') && shelfCols() !== ui.cols) route(); }, 150);
});
window.addEventListener('online', backgroundCovers);
async function pullFromOtherWindow() {
  if (!store.db || sheet.open || swipeDlg.open) return;
  const disk = await store.get('state').catch(() => null);
  if (disk?.items && (disk.rev || 0) > (state.rev || 0)) { state = disk; route(); }
}
tabChannel?.addEventListener('message', pullFromOtherWindow);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pullFromOtherWindow(); });

async function init() {
  try {
    await store.open();
    const saved = await store.get('state');
    // keep the library exactly as it was before any update touches it
    if (saved?.items && (saved.version || 1) < DB_VERSION) await snapshot(saved, `לפני עדכון לגרסה ${DB_VERSION}`);
    state = saved?.items ? migrate(saved) : freshState();
    await store.put('state', state);
    await fileSync.init();
  } catch (e) {
    console.warn('IndexedDB unavailable', e);
    state = freshState();
    setTimeout(() => toast('הדפדפן לא מאפשר שמירה כאן. שינויים לא יישמרו'), 600);
  }
  navigator.storage?.persist?.().catch(() => {});
  route();
  wheelState.test = wheelSelfTest();
  setTimeout(backgroundCovers, 1500);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
init();
</script>
